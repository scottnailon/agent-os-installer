name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y age shellcheck
          else
            brew install age shellcheck || true
          fi

      - name: Shell syntax
        run: for f in *.sh; do bash -n "$f"; done

      - name: shellcheck
        run: shellcheck -S error -e SC1091 *.sh

      - name: JSON validity
        run: for f in *.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done

      - name: Secret scan
        run: |
          set -e
          if grep -rnE "(sk-[A-Za-z0-9_-]{24,}|sk-or-v1-[A-Za-z0-9]{24,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})" \
               --exclude=test.sh --exclude-dir=.git . ; then
            echo "::error::Possible secret committed"; exit 1
          fi
          echo "No secrets found."

      - name: Test suite
        run: chmod +x *.sh && ./test.sh
